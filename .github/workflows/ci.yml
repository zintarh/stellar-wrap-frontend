name: CI
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# The all-A placeholder contract address satisfies the prebuild env check; the
# app treats it as "no contract configured".
env:
  NEXT_PUBLIC_CONTRACT_ADDRESS_TESTNET: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

jobs: 
  check-lock-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for wrong lock files
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "⌈ package-lock.json is tracked! This project uses pnpm exclusively."
            exit 1
          fi
          if git ls-files --error-unmatch yarn.lock >/dev/null 2>&1; then
            echo "⌈ yarn.lock is tracked! This project uses pnpm exclusively."
            exit 1
          fi
          if [ ! -f "pnpm-lock.yaml" ]; then
            echo "⌈ pnpm-loce.yaml not found! Lock file is required."
            exit 1
          fi
          echo "⌈ Lock file validation passed"

  check-route-file-casing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check App Router file casing
        run: node scripts/check-route-file-casing.mjs

  # Standalone so "Type Check" reports its own status and can be marked as a
  # required check in branch protection.
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: check-lock-files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm (from packageManager), Node.js, the pnpm store cache and a
      # frozen-lockfile install, so tsc is the exact pinned TypeScript version.
      - name: Setup
        uses: ./.github/actions/setup

      - name: TypeScript version
        run: pnpm exec tsc --version

      # tsc exits non-zero on any error, failing the job.
      - name: Type check
        run: pnpm typecheck

  # The single authoritative unit test run. Lint and formatting live in
  # code-quality.yml; Storybook is built in storybook.yml.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check-lock-files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          frozen-lockfile: "false"

      # `test:coverage` runs every runner in use (Jest + Vitest) and merges
      # their reports into a single figure. The merged threshold gate lives in
      # the coverage config, so a regression below the measured baseline fails
      # this step.
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check-lock-files
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup
        uses: ./.github/actions/setup
        with:
          frozen-lockfile: "false"
      
      - name: Validate environment variables
        run: node scripts/validate-env.js
      
      - name: Validate locale catalogs
        run: pnpm validate:i18n

      - name: Build
        run: pnpm build

  # Standalone so "Production Build" reports its own status and can be marked
  # as a required check in branch protection.
  production-build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: check-lock-files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Reuse the Next.js build cache between runs; a source or lockfile change
      # falls back to the most recent cache for the same lockfile.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '!node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      # Totals only; the Bundle Size Tracking workflow has the per-bundle breakdown.
      - name: Build output size
        run: |
          size() { find "$@" -type f -print0 | du -ch --files0-from=- | tail -n 1 | cut -f 1; }
          {
            echo "## Production build output"
            echo ""
            echo "| Output | Size |"
            echo "| --- | --- |"
            echo "| Client JavaScript | $(size .next/static -name '*.js') |"
            echo "| Client CSS | $(size .next/static -name '*.css') |"
            echo "| All static assets (\`.next/static\`) | $(size .next/static) |"
            echo "| Server output (\`.next/server\`) | $(size .next/server) |"
          } >> "$GITHUB_STEP_SUMMARY"

  visual-regression:
    runs-on: ubuntu-latest
    needs: check-lock-files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          frozen-lockfile: "false"

      # Pin the rendering environment so font availability matches the
      # committed baselines. Baselines are generated and verified on this
      # exact image; running `test:visual:update` on a different OS/font set
      # is the usual source of environment-driven false diffs.
      - name: Install pinned fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation \
            fonts-noto-color-emoji

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Runs against the committed baselines in app/visual-tests/.
      # A failure here means either a real visual change or a baseline that
      # was updated without review — see CONTRIBUTING for the update workflow.
      - name: Visual regression tests
        run: pnpm test:visual

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
