name: CI
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"

jobs: 
  check-lock-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for wrong lock files
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "⌈ package-lock.json is tracked! This project uses pnpm exclusively."
            exit 1
          fi
          if git ls-files --error-unmatch yarn.lock >/dev/null 2>&1; then
            echo "⌈ yarn.lock is tracked! This project uses pnpm exclusively."
            exit 1
          fi
          if [ ! -f "pnpm-lock.yaml" ]; then
            echo "⌈ pnpm-loce.yaml not found! Lock file is required."
            exit 1
          fi
          echo "⌈ Lock file validation passed"

  # The single authoritative unit test run. Lint, formatting and type checks
  # live in code-quality.yml; Storybook is built in storybook.yml.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check-lock-files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          frozen-lockfile: "false"

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check-lock-files
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup
        uses: ./.github/actions/setup
        with:
          frozen-lockfile: "false"
      
      - name: Validate environment variables
        run: node scripts/validate-env.js
      
      - name: Validate locale catalogs
        run: pnpm validate:i18n

      - name: Build
        run: pnpm build

  visual-regression:
    runs-on: ubuntu-latest
    needs: check-lock-files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          frozen-lockfile: "false"

      # Pin the rendering environment so font availability matches the
      # committed baselines. Baselines are generated and verified on this
      # exact image; running `test:visual:update` on a different OS/font set
      # is the usual source of environment-driven false diffs.
      - name: Install pinned fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation \
            fonts-noto-color-emoji

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Runs against the committed baselines in app/visual-tests/.
      # A failure here means either a real visual change or a baseline that
      # was updated without review — see CONTRIBUTING for the update workflow.
      - name: Visual regression tests
        run: pnpm test:visual

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
