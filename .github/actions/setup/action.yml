name: Setup
description: Install pnpm (version from package.json packageManager), Node.js with the pnpm store cache, and project dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    default: "22"
  frozen-lockfile:
    description: Fail the install when pnpm-lock.yaml is out of date with package.json.
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '--no-frozen-lockfile' }}
